<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inscripciones | Admin APJ</title>
  <meta name="description" content="Inscripciones del torneo seleccionado." />
  <meta name="robots" content="noindex,nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .ins-category-block { margin-bottom: 24px; }
    .ins-category-header {
      padding: 12px 16px;
      background: var(--bg-3);
      border-radius: 8px 8px 0 0;
      border: 1px solid var(--border);
      border-bottom: none;
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px;
    }
    .ins-category-header h3 { margin: 0; font-size: 14px; font-weight: 600; }
    .ins-category-count {
      font-size: 12px; color: var(--text-secondary);
      background: var(--card); padding: 2px 8px; border-radius: 9999px;
      border: 1px solid var(--border);
    }
    .ins-table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 0 0 8px 8px;
    }
    .ins-table {
      width: 100%;
      min-width: 960px;
      border-collapse: collapse;
      font-size: 13px;
      table-layout: fixed;
    }
    /* Identical column widths across every category table so the columns
       line up vertically as you scan top-to-bottom. */
    .ins-table th:nth-child(1), .ins-table td:nth-child(1) { width: 22%; }
    .ins-table th:nth-child(2), .ins-table td:nth-child(2) { width: 22%; }
    .ins-table th:nth-child(3), .ins-table td:nth-child(3) { width: 12%; }
    .ins-table th:nth-child(4), .ins-table td:nth-child(4) { width: 12%; }
    .ins-table th:nth-child(5), .ins-table td:nth-child(5) { width: 32%; }
    .ins-table thead th {
      padding: 10px 14px; text-align: left;
      font-weight: 600; font-size: 11px; text-transform: uppercase;
      letter-spacing: 0.04em; color: var(--text-secondary);
      background: var(--bg-3); border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    .ins-table tbody td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
      overflow: hidden;
      text-overflow: ellipsis;
      word-break: break-word;
    }
    .ins-table tbody tr { height: 64px; }
    .ins-table tbody tr:last-child td { border-bottom: none; }
    .ins-table tbody tr:hover { background: var(--card-hover); }
    /* Fixed two-line layout for the player cells so a missing phone doesn't
       collapse the row. The second line keeps its baseline (or a non-breaking
       space if no phone) and content starts from the top of the cell area. */
    .ins-player-cell {
      display: flex; flex-direction: column; justify-content: center;
      gap: 2px;
      min-height: 36px;
    }
    .ins-player-cell .name { font-weight: 600; }
    .ins-player-cell .phone {
      color: var(--text-secondary); font-size: 12px;
      min-height: 14px;
    }
    .ins-paid-pill {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 10px; border-radius: 9999px;
      font-size: 11px; font-weight: 600;
      border: 1px solid;
      white-space: nowrap;
    }
    .ins-paid-pill.green { color: #16a34a; border-color: rgba(22,163,74,0.35); background: rgba(22,163,74,0.08); }
    .ins-paid-pill.gray  { color: var(--text-secondary); border-color: var(--border); background: var(--card); }

    /* Restriction chips — one per active rule (mode/days/time) */
    .ins-restriction-chips {
      display: flex; flex-direction: column; gap: 4px;
      max-width: 280px;
    }
    .ins-restriction-chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px; border-radius: 9999px;
      font-size: 12px; font-weight: 500;
      border: 1px solid; line-height: 1.2;
      width: fit-content;
    }
    .ins-restriction-chip-icon { font-size: 13px; line-height: 1; }
    .ins-restriction-chip-initials {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 22px; height: 18px;
      padding: 0 5px;
      font-size: 10px; font-weight: 700;
      letter-spacing: 0.04em;
      border-radius: 9999px;
      color: #fff;
      text-transform: uppercase;
    }
    .ins-restriction-chip.green .ins-restriction-chip-initials { background: #16a34a; }
    .ins-restriction-chip.red   .ins-restriction-chip-initials { background: #dc2626; }
    .ins-restriction-chip.blue  .ins-restriction-chip-initials { background: #2563eb; }
    .ins-restriction-chip.gray  .ins-restriction-chip-initials { background: var(--text-secondary); }
    .ins-restriction-chip.green {
      color: #16a34a; border-color: rgba(22,163,74,0.35); background: rgba(22,163,74,0.08);
    }
    .ins-restriction-chip.red {
      color: #dc2626; border-color: rgba(220,38,38,0.35); background: rgba(220,38,38,0.08);
    }
    .ins-restriction-chip.blue {
      color: #2563eb; border-color: rgba(37,99,235,0.35); background: rgba(37,99,235,0.08);
    }
    .ins-restriction-chip.gray {
      color: var(--text-secondary); border-color: var(--border); background: var(--card);
    }
  </style>
</head>
<body class="admin-page">

<template id="admin-page-template">
  <div class="profile-page-header">
    <h1>Inscripciones</h1>
    <p id="ins-tournament-subtitle" style="color:var(--text-secondary);">Selecciona un torneo en el menu lateral.</p>
  </div>

  <div id="ins-list">
    <div class="profile-card">
      <div class="profile-card-body" style="text-align:center; color:var(--text-secondary); padding:48px 24px;">
        Selecciona un torneo arriba para ver sus inscripciones.
      </div>
    </div>
  </div>
</template>

<div id="admin-shell-root"></div>

<script src="/api/config"></script>
<script src="/js/api.js"></script>
<script src="/js/validation.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/admin-shell.js"></script>
<script src="/js/admin-torneo-inscripciones.js"></script>
<script src="/js/app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', async () => {
    const result = await APJAdminShell.mount({ active: 'inscripciones' });
    if (result) APJAdminTorneoInscripciones.start();
  });
</script>

</body>
</html>
